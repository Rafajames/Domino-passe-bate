name: Publicar no GitHub Pages

on:
  push:
    branches: [main, ccr-d50bb83e-qic6gi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Chave pública (pode ficar no código): liga o servidor reserva do online.
          VITE_SUPABASE_URL: https://peebmrbbpvzmghwogtwh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_qgLOwij8RNaLX6t6giWmSw_JqydtRny
          # TURN dedicado (opcional): crie os secrets no GitHub para usar.
          VITE_TURN_URL: ${{ secrets.TURN_URL }}
          VITE_TURN_USER: ${{ secrets.TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.TURN_PASS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
