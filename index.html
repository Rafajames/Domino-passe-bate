<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1412" />
    <meta name="description" content="Dominó Passe e Bate e All Fives com regras regionais configuráveis. Jogue contra bots em quatro níveis." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Passe & Bate — Dominó</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;background:#0c1412;color:#c9d1cb;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <div>
          <p style="font-size:20px;margin:0 0 8px">Carregando o jogo…</p>
          <p id="boot-msg" style="font-size:14px;color:#94a39b;margin:0"></p>
        </div>
      </div>
    </div>
    <noscript><p style="color:#fff;text-align:center">Ative o JavaScript para jogar.</p></noscript>
    <script>
      // Se o app não iniciar (navegador antigo ou erro), explica em vez de deixar a tela em branco.
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-msg');
          if (el) el.textContent = msg;
        }
        window.addEventListener('error', function (e) {
          show('Não foi possível iniciar: ' + (e.message || 'erro desconhecido') + '. Atualize o navegador e recarregue a página.');
        });
        setTimeout(function () {
          if (document.getElementById('boot')) {
            show('Está demorando. Se continuar assim, atualize o Chrome (Play Store) e recarregue a página.');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
